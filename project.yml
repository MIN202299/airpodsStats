# 备用：如果自带的 AirPodsStats.xcodeproj 打不开，可用 XcodeGen 重新生成
#   brew install xcodegen && xcodegen generate
name: AirPodsStats
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
targets:
  AirPodsStats:
    type: application
    platform: iOS
    sources:
      - AirPodsStats
    entitlements:
      path: Config/AirPodsStats.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.airpodsstats
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 耳机统计
        INFOPLIST_KEY_NSHealthShareUsageDescription: 读取“耳机音频级别”历史记录，用来统计 AirPods 等耳机的佩戴时长。数据只在本机处理。
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: 本应用不会写入任何健康数据。
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
